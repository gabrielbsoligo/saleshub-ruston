name: Kommo Stamina Probe (diagnostico)

# DIAGNOSTICO — mede quantos leads a sessao aguenta ANTES do chat virar skeleton, do IP
# do Actions (datacenter). NAO grava banco, NAO roda o worker de producao. Reusa a sessao
# do secret KOMMO_STORAGE_STATE_B64. Sobe stamina_out/stamina.csv como artifact.
# Rode com varios pace/scroll e compare com o resultado LOCAL do mesmo script.
on:
  workflow_dispatch:
    inputs:
      leads:
        description: "quantos leads abrir (max)"
        default: "15"
      pace:
        description: "segundos entre leads"
        default: "5"
      scroll:
        description: "carga por lead"
        type: choice
        options: ["full", "light"]
        default: "full"
      timed_gap:
        description: "espacar leads nesse tempo (s) p/ isolar tempo-vs-uso (0 = usa pace)"
        default: "0"

permissions:
  contents: read

# mesma sessao/IP do worker — nunca em paralelo com ele.
concurrency:
  group: kommo-msg-worker
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (Playwright + Chromium + xvfb)
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: Restore Kommo session
        env:
          KOMMO_STORAGE_STATE_B64: ${{ secrets.KOMMO_STORAGE_STATE_B64 }}
        run: |
          if [ -z "$KOMMO_STORAGE_STATE_B64" ]; then echo "::error::secret KOMMO_STORAGE_STATE_B64 vazio"; exit 1; fi
          printf '%s' "$KOMMO_STORAGE_STATE_B64" | base64 -d > storage_state.json
          python - <<'PY'
          import json; json.load(open("storage_state.json")); print("storage_state.json OK")
          PY
      - name: Run stamina probe (headed via xvfb)
        run: |
          xvfb-run -a python scripts/spikes/session_stamina_probe_local.py \
            --leads "${{ github.event.inputs.leads }}" \
            --pace "${{ github.event.inputs.pace }}" \
            --scroll "${{ github.event.inputs.scroll }}" \
            --timed-gap "${{ github.event.inputs.timed_gap }}"
      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stamina-csv
          path: stamina_out/stamina.csv
          if-no-files-found: warn
      - name: Cleanup
        if: always()
        run: rm -f storage_state.json
